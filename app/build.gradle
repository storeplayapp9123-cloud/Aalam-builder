plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aalam.compiler'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aalam.compiler'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// android.jar ko assets me copy karta hai (ECJ ko compile ke liye chahiye)
tasks.register('copyAndroidJar', Copy) {
    def jar = new File(android.sdkDirectory, 'platforms/android-34/android.jar')
    doFirst {
        if (!jar.isFile()) throw new GradleException('android.jar nahi mila: ' + jar)
    }
    from(jar)
    into('src/main/assets')
}

tasks.named('preBuild') {
    dependsOn 'copyAndroidJar'
}

dependencies {
    // ecj.jar, d8 jars yahan app/libs me rakhenge (agle steps me)
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.eclipse.jdt:ecj:3.26.0'
}
